name: Build TriFold XREAL 3DoF Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace --warning-mode all

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriFold-XREAL-Spatial-Launcher-APK
          path: app/build/outputs/apk/**/*.apk
